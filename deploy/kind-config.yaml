# Single-node kind cluster. The port mapping exposes Kafka's external listener on localhost:9094
# so the load generator and the benchmark collector can run on the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jev-bench
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30094
        hostPort: 9094
        protocol: TCP
